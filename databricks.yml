bundle:
  name: worker_safety

include:
  - resources/*.yml

sync:
  include:
    - app/app.yaml  # generated by scripts/deploy.sh and gitignored, but the App needs it
  exclude:
    - config/**
    - device/**
    - shared/**
    - tests/**
    - tools/**

variables:
  catalog:
    description: UC catalog for the worker_safety schema (CATALOG in config/demo.env; `workspace` on Free Edition)
  warehouse_id:
    description: Serverless SQL warehouse (WAREHOUSE_ID in config/demo.env)
  device_sp_app_id:
    description: Application ID of the worker-safety-device service principal
  pg_project:
    default: worker-safety

targets:
  # The workspace comes from DATABRICKS_PROFILE in config/demo.env (scripts/deploy.sh passes it to the CLI).
  free:
    default: true
